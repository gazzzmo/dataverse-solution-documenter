# Azure DevOps Pipeline Step Template: Dataverse Solution Documenter
# Generates structured Markdown documentation from an exported Dataverse solution .zip archive.

parameters:
  - name: solutionPath
    type: string
    displayName: "Path to Dataverse Solution .zip"
  
  - name: outputPath
    type: string
    default: "$(Build.ArtifactStagingDirectory)/docs"
    displayName: "Output Directory for Markdown Documentation"

  - name: pythonVersion
    type: string
    default: "3.11"
    displayName: "Python Version"

  - name: packageSource
    type: string
    default: "pypi"
    displayName: "Package Installation Source"
    values:
      - pypi
      - local

  - name: localPackagePath
    type: string
    default: "$(Build.SourcesDirectory)"
    displayName: "Path to repo root if using local source"

  - name: publishArtifact
    type: boolean
    default: true
    displayName: "Publish generated docs as a pipeline artifact"

  - name: artifactName
    type: string
    default: "SolutionDocumentation"
    displayName: "Artifact Name"

steps:
  - task: UsePythonVersion@0
    displayName: "Set up Python ${{ parameters.pythonVersion }}"
    inputs:
      versionSpec: "${{ parameters.pythonVersion }}"
      addToPath: true

  - ${{ if eq(parameters.packageSource, 'pypi') }}:
    - script: |
        python -m pip install --upgrade pip
        pip install dataverse-solution-documenter
      displayName: "Install Dataverse Solution Documenter from PyPI"

  - ${{ if eq(parameters.packageSource, 'local') }}:
    - script: |
        python -m pip install --upgrade pip
        pip install -e "${{ parameters.localPackagePath }}"
      displayName: "Install Dataverse Solution Documenter from local source"

  - script: |
      dsd -i "${{ parameters.solutionPath }}" -o "${{ parameters.outputPath }}" -v
    displayName: "Generate Dataverse Solution Documentation (dsd)"

  - ${{ if eq(parameters.publishArtifact, true) }}:
    - task: PublishPipelineArtifact@1
      displayName: "Publish Solution Documentation Artifact"
      inputs:
        targetPath: "${{ parameters.outputPath }}"
        artifactName: "${{ parameters.artifactName }}"
